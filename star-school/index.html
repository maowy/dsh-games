  /* ---------- 数学 ---------- */
  function makeMath() {
    var kinds = ['count', 'add', 'compare', 'shape', 'pattern', 'seq'];
    if (maxNumber > 5) kinds = kinds.concat(['sub', 'add', 'decompose', 'biggest', 'step2']);
    var kind = pick(kinds);
    if (DEBUG_KIND && ['count', 'add', 'sub', 'compare', 'shape', 'pattern', 'seq', 'decompose', 'biggest', 'step2'].indexOf(DEBUG_KIND) >= 0) kind = DEBUG_KIND;

        options: r2.opts, answer: r2.answer, tag: { kind: 'none' },

    if (kind === 'sub') {

      var r3 = numberOptions(left, OPTIONS, 1, Math.max(maxNumber, t2 + 1));
      return {
        id: 'math:sub:' + t2 + '-' + eaten,

        card: { type: 'sub', emoji: em3, total: t2, eaten: eaten },

      var e1 = pick(FRUIT), e2 = pick(FRUIT.filter(function (x) { return x !== e1; }));
      var ansC = la > lb ? 0 : (lb > la ? 1 : 2);
      return {
        id: 'math:cmp:' + la + ':' + lb,
        sub: 'math',
        prompt: '哪一边更多？',
        say: '哪一边更多？',

    if (kind === 'decompose') {
      var tt = randInt(3, Math.min(maxNumber, 9));

      var rest2 = tt - part;
      var r5 = numberOptions(rest2, OPTIONS, 1, Math.max(maxNumber, tt + 1));
      return {
        id: 'math:dec:' + tt + '-' + part,
        sub: 'math',
        prompt: '还差几个？',
        say: tt + ' 可以分成 ' + part + ' 和几？',
        card: { type: 'decompose', total: tt, part: part },
        options: r5.opts, answer: r5.answer, tag: { kind: 'none' },
        praise: pick(PRAISE) + ' ' + tt + ' 可以分成 ' + part + ' 和 ' + rest2 + '。'
      };
    }

    if (kind === 'biggest') {
      var r4 = numberOptions(randInt(1, maxNumber), OPTIONS, 1, maxNumber);
      var biggest = 0;
      for (var q2 = 0; q2 < r4.opts.length; q2++) if (r4.opts[q2].n > r4.opts[biggest].n) biggest = q2;
      var nums = r4.opts.map(function (o) { return o.n; });
      return {
        id: 'math:big:' + nums.join(','),
        sub: 'math',
        prompt: '哪个数字最大？',
        say: '哪个数字最大？',
        card: { type: 'none', hint: '🔍' },
        options: r4.opts, answer: biggest, tag: { kind: 'none' },
        praise: pick(PRAISE) + ' ' + cnNum(nums[biggest]) + ' 最大。'
      };
    }

    if (kind === 'step2') {
      var st = randInt(0, 2);
      var seq = [2 + st * 2, 4 + st * 2, 6 + st * 2];

      var r6 = numberOptions(nx, OPTIONS, 1, nx + 3);
      return {

      };

    var start = randInt(1, Math.max(1, maxNumber - 3));
    var ansN = start + 3;
    var r7 = numberOptions(ansN, OPTIONS, Math.max(1, start - 1), ansN + 2);
    return {
      id: 'math:seq:' + start,

  /* ---------- 唐诗：听整首诗，找出诗里说的东西 ---------- */
  function makePoem() {
    var pool = POEMS.filter(function (p) { return Object.keys(p.pics).length > 0; });
    var p = pick(pool);
    var idxs = Object.keys(p.pics).map(Number);
    var li = pick(idxs);
    var correct = p.pics[li];
    var others = [];
    while (others.length < OPTIONS - 1) {
      var cand = pick(['🌙', '☀️', '🌸', '🐦', '❄️', '🐟', '🍚', '🏯', '🦢', '👶', '🌱', '💧', '🦋', '⛰️', '🪁']);
      if (cand !== correct && others.indexOf(cand) < 0) others.push(cand);
    }
    var opts = shuffle([{ type: 'emoji', emoji: correct }].concat(
      others.map(function (o) { return { type: 'emoji', emoji: o }; })
    ));
    var ans = 0;
    for (var i = 0; i < opts.length; i++) if (opts[i].emoji === correct) ans = i;
    return {
      id: 'poem:' + p.title + ':' + li,
      sub: 'poem',
      prompt: '听诗，选出诗里的东西',
      say: p.title + '，' + p.author + '。' + p.lines.join('，') + '。这首诗里说到了什么？',
      card: { type: 'poem', title: p.title, author: p.author, line: p.lines[li] },
      options: opts,
      answer: ans,
      tag: { kind: 'none' },
      praise: '对！「' + p.lines[li] + '」。'
    };
  }

  /* ---------- 儿歌：听懂是哪一首 / 补最后一个词 ---------- */
  function makeRhyme() {
    var r = pick(RHYMES);
    if (r.blank && Math.random() < 0.5) {
      var b = r.blank;
      var opts2 = shuffle(b.opts.map(function (o, i) {
        return { type: 'emoji', emoji: o[0], label: o[1], _i: i };
      }));
      var ans2 = 0;
      for (var i = 0; i < opts2.length; i++) if (opts2[i]._i === b.ans) ans2 = i;
      return {
        id: 'rhyme:' + r.title + ':blank',
        sub: 'rhyme',
        prompt: '接下去是什么？',
        say: b.text.replace('__', '……') + '，接下去是什么？',
        card: { type: 'rhyme', title: r.title, line: b.text, blanked: true },
        options: opts2,
        answer: ans2,
        tag: { kind: 'none' },
        praise: '对！' + r.lines.join('，') + '。'
      };
    }
    var others = [];
    while (others.length < OPTIONS - 1) {
      var cand = pick(RHYMES.filter(function (x) { return x.subject[1] !== r.subject[1]; }));
      if (others.every(function (o) { return o[1] !== cand.subject[1]; })) others.push(cand.subject);
    }
    var opts3 = shuffle([{ type: 'emoji', emoji: r.subject[0], label: r.subject[1] }].concat(
      others.map(function (o) { return { type: 'emoji', emoji: o[0], label: o[1] }; })
    ));
    var ans3 = 0;
    for (var j = 0; j < opts3.length; j++) if (opts3[j].label === r.subject[1]) ans3 = j;
    return {
      id: 'rhyme:' + r.title + ':sub',
      sub: 'rhyme',
      prompt: '这首儿歌说的是谁？',
      say: r.lines.join('，') + '。这首儿歌说的是谁？',
      card: { type: 'rhyme', title: r.title, line: r.lines.join('，') },
      options: opts3,
      answer: ans3,
      tag: { kind: 'none' },
      praise: '对！这是《' + r.title + '》。'
    };
  }

  /* ---------- 认颜色 ---------- */
  function swatchOpts(correct, n) {
    var others = sample(PAINTS.filter(function (p) { return p.zh !== correct.zh; }), n - 1);
    var opts = shuffle([{ type: 'swatch', hex: correct.hex, label: correct.zh }].concat(

    for (var i = 0; i < opts.length; i++) if (opts[i].label === correct.zh) ans = i;

  /* ---------- 认时间 ---------- */
  function makeTime() {
    if (Math.random() < 0.45) {
      var d = pick(DAY_PARTS);
      var optsD = shuffle([
        { type: 'text', text: '早上', emoji: '🌤️' },

  function makeQuestion(sub) {
    if (sub === 'lit') return makeLit();
    if (sub === 'pinyin') return makePinyin();
    if (sub === 'math') return makeMath();
    if (sub === 'en') return makeEn();
    if (sub === 'poem') return makePoem();
    if (sub === 'rhyme') return makeRhyme();
    if (sub === 'color') return makeColor();
    if (sub === 'time') return makeTime();
    return makeLit();
  }

  var ALL_SUBJECTS = ['lit', 'pinyin', 'math', 'en', 'poem', 'rhyme', 'color', 'time'];

  function buildRound(mode) {
    var subs = [];
    if (mode === 'mix') {
      var bag = [];
      while (bag.length < NQ) bag = bag.concat(shuffle(ALL_SUBJECTS));
      subs = shuffle(bag.slice(0, NQ));
    } else {
      for (var i = 0; i < NQ; i++) subs.push(mode);
    }
    var out = [], used = {};
    for (var j = 0; j < subs.length; j++) {
      var q = null, guard = 0;
      do { q = makeQuestion(subs[j]); guard++; } while (q && used[q.id] && guard < 30);
      if (q && !used[q.id]) { used[q.id] = 1; out.push(q); }
    }
    return out;
  }

  var STORAGE = 'starSchool.v2';
  function emptySave() { return { total: 0, best: 0, learnedChars: {}, learnedWords: {}, wrong: [], days: {} }; }
  function loadSave() {
    var s = emptySave();
    try {
      var raw = window.localStorage.getItem(STORAGE);
      if (raw) {
        var o = JSON.parse(raw);
        s.total = Math.max(0, Math.round(num(o.total, 0)));
        s.best = Math.max(0, Math.round(num(o.best, 0)));
        if (o.learnedChars && typeof o.learnedChars === 'object') s.learnedChars = o.learnedChars;
        if (o.learnedWords && typeof o.learnedWords === 'object') s.learnedWords = o.learnedWords;
        if (Array.isArray(o.wrong)) s.wrong = o.wrong.filter(function (w) { return w && w.q; }).slice(0, 40);
        if (o.days && typeof o.days === 'object') s.days = o.days;
      }
    } catch (e) { /* 隐私模式或损坏就当新档 */ }
    return s;
  }
  function writeSave() {
    try { window.localStorage.setItem(STORAGE, JSON.stringify(save)); } catch (e) {}
  }
  function countKeys(o) { var n = 0; for (var k in o) if (o.hasOwnProperty(k)) n++; return n; }
  function addWrong(q) {
    for (var i = 0; i < save.wrong.length; i++) {
      if (save.wrong[i].id === q.id) { save.wrong[i].n = (save.wrong[i].n || 1) + 1; return; }
    }
    save.wrong.unshift({ id: q.id, q: q, n: 1, t: Date.now() });
    if (save.wrong.length > 40) save.wrong.length = 40;
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function dayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function dayEntry(key) {
    if (!save.days[key]) save.days[key] = { l: [], w: [], a: 0, c: 0, s: {} };
    var e = save.days[key];
    if (!e.l) e.l = [];
    if (!e.w) e.w = [];
    if (!e.s) e.s = {};

  function rr(g, x, y, w, h, r) {

    // 前爪
    g.fillStyle = '#FFF8F0';
    g.beginPath(); g.ellipse(cx - 13 * u, baseY - 3 * u, 8 * u, 5 * u, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(cx + 13 * u, baseY - 3 * u, 8 * u, 5 * u, 0, 0, Math.PI * 2); g.fill();

    drawFoxHead(g, cx, headCy, headW, mood);
    g.restore();
  }

  /* ============================================================
   * 8. 背景
   * ============================================================ */
  var bgImg = null;
  var bgCustom = !!(GAME.slots && GAME.slots.background && GAME.slots.background.custom);

  function drawSky(g) {
    var grad = g.createLinearGradient(0, 0, 0, cssH);
    grad.addColorStop(0, '#CFEBFB');
    grad.addColorStop(0.42, '#EAF6FF');
    grad.addColorStop(0.66, '#FFF3DE');
    grad.addColorStop(1, '#FFE6C4');
    g.fillStyle = grad;
    g.fillRect(0, 0, cssW, cssH);

    if (bgImg && bgCustom) {
      var iw = bgImg.naturalWidth || 768, ih = bgImg.naturalHeight || 1366;
      var sc = Math.max(cssW / iw, cssH / ih);
      g.drawImage(bgImg, (cssW - iw * sc) / 2, (cssH - ih * sc) / 2, iw * sc, ih * sc);
      g.fillStyle = 'rgba(255,250,240,0.35)';
      g.fillRect(0, 0, cssW, cssH);
      return;
    }

    // 太阳
    var sx = cssW * 0.885, sy = cssH * 0.195, sr = Math.min(cssW, cssH) * 0.040;
    g.save();
    g.globalAlpha = 0.55;
    g.fillStyle = '#FFE08A';
    g.beginPath(); g.arc(sx, sy, sr * 2.1, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
    g.fillStyle = '#FFD25E';
    g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.fill();
    g.restore();

    // 云
    cloud(g, cssW * 0.30 + Math.sin(t * 0.06) * 10 * k, cssH * 0.045, 40 * k, 0.8);
    cloud(g, cssW * 0.66 + Math.sin(t * 0.05 + 2) * 12 * k, cssH * 0.115, 30 * k, 0.7);

    // 远山
    g.fillStyle = '#CBE7C8';
    g.beginPath();
    g.moveTo(0, cssH);
    g.lineTo(0, cssH * 0.72);
    g.quadraticCurveTo(cssW * 0.24, cssH * 0.58, cssW * 0.52, cssH * 0.72);
    g.quadraticCurveTo(cssW * 0.78, cssH * 0.84, cssW, cssH * 0.70);
    g.lineTo(cssW, cssH);
    g.closePath();
    g.fill();

    g.fillStyle = '#A9D9B4';
    g.beginPath();
    g.moveTo(0, cssH);
    g.lineTo(0, cssH * 0.86);
    g.quadraticCurveTo(cssW * 0.3, cssH * 0.74, cssW * 0.6, cssH * 0.88);
    g.quadraticCurveTo(cssW * 0.85, cssH * 0.96, cssW, cssH * 0.86);
    g.lineTo(cssW, cssH);
    g.closePath();
    g.fill();

    // 两侧小树
    tree(g, cssW * 0.06, cssH * 0.80, 42 * k, '#8FCF9F', 0.75);
    tree(g, cssW * 0.94, cssH * 0.76, 36 * k, '#8FCF9F', 0.6);
  }

  function cloud(g, x, y, r, alpha) {
    g.save();
    g.globalAlpha = alpha;
    g.fillStyle = '#FFFFFF';
    g.beginPath();
    g.arc(x, y, r * 0.62, 0, Math.PI * 2);
    g.arc(x + r * 0.62, y + r * 0.1, r * 0.46, 0, Math.PI * 2);
    g.arc(x - r * 0.6, y + r * 0.12, r * 0.4, 0, Math.PI * 2);
    g.arc(x + r * 0.2, y - r * 0.3, r * 0.44, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  function tree(g, x, baseY, h, color, alpha) {
    g.save();
    g.globalAlpha = alpha;
    g.fillStyle = '#B98B5E';
    g.fillRect(x - h * 0.06, baseY - h * 0.35, h * 0.12, h * 0.35);
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(x, baseY - h);
    g.lineTo(x + h * 0.42, baseY - h * 0.42);
    g.lineTo(x - h * 0.42, baseY - h * 0.42);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(x, baseY - h * 1.22);
    g.lineTo(x + h * 0.32, baseY - h * 0.74);
    g.lineTo(x - h * 0.32, baseY - h * 0.74);
    g.closePath(); g.fill();
    g.restore();
  }

  /* ============================================================
   * 9. 各屏绘制
   * ============================================================ */
  function drawTopBar() {
    var g = ctx;
    var m = MODES[state.mode] || MODES.mix;

    // 返回
    card(g, ui.back.x, ui.back.y, ui.back.w, ui.back.h, 14, 'rgba(255,255,255,0.92)', C.line, 0.05);
    g.save();
    g.strokeStyle = C.ink;
    g.lineWidth = 3 * k;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    var bx = ui.back.x + ui.back.w / 2, by = ui.back.y + ui.back.h / 2;
    g.beginPath();
    g.moveTo(bx + 6 * k, by - 8 * k);
    g.lineTo(bx - 5 * k, by);
    g.lineTo(bx + 6 * k, by + 8 * k);
    g.stroke();
    g.restore();

    // 小狐狸头像
    drawFoxHead(g, ui.foxHud.x + 26, ui.foxHud.y + 30, 46, starPop > 0.2 ? 'happy' : 'idle');

    // 科目牌
    card(g, ui.chip.x, ui.chip.y, ui.chip.w, ui.chip.h, 15, m.tint, null, 0);
    txt(g, m.emoji + ' ' + m.name, ui.chip.x + ui.chip.w / 2, ui.chip.y + ui.chip.h / 2 + 1, 15 * k, m.color, 800);

    // 星星总数
    card(g, ui.pill.x, ui.pill.y, ui.pill.w, ui.pill.h, 17, '#FFF6DA', '#F4DFA8', 0.10);
    drawStar(g, ui.pill.x + 22, ui.pill.y + ui.pill.h / 2, 9 * k, C.gold, C.goldDeep);
    txt(g, String(save.total + state.stars), ui.pill.x + 48, ui.pill.y + ui.pill.h / 2 + 1, 15 * k, '#A9791B', 800);

    // 进度星
    var teaching = state.phase === 'teach';
    var n = teaching ? (state.teachQueue ? state.teachQueue.length : 3) : (state.questions.length || NQ);
    var gapS = Math.min(24 * k, (vw - 60) / n);
    var startX = vw / 2 - (n - 1) * gapS / 2;
    var finished = teaching ? state.teachIdx : (state.qi + (cur && cur.done ? 1 : 0));
    for (var i = 0; i < n; i++) {
      var r = 7 * k;
      var sxp = startX + i * gapS;
      if (i < finished) {
        drawStar(g, sxp, ui.progY + 10, r, C.gold, C.goldDeep);
      } else if (i === finished) {
        drawStar(g, sxp, ui.progY + 10, r + 1.6 * k, '#FFE9B0', '#EFD08C');
      } else {
        drawStar(g, sxp, ui.progY + 10, r, '#FFFFFF', '#E4D5C2');
      }
    }
  }

  function drawCardContent(g, q, r) {
    var cx = r.x + r.w / 2;
    var contentTop = r.y + (q.card.type === 'none' ? 0 : 42);
    var contentH = r.h - (q.card.type === 'none' ? 0 : 46);
    var cy = contentTop + contentH / 2;
    var cd = q.card;

    if (cd.type === 'listen') {
      // 没有配图的字：听音找字
      g.fillStyle = '#F3ECFF';
      g.beginPath();
      var lr = Math.min(r.h * 0.17, 40 * k);
      g.arc(cx, cy - 10 * k, lr, 0, Math.PI * 2);
      g.fill();
      emoji(g, '🔊', cx, cy - 10 * k, lr * 1.05);
      txt(g, '点一下再听', cx, cy + lr + 6 * k, 11.5 * k, C.inkFaint, 700);
    } else if (cd.type === 'blend') {
      var bs = Math.min(r.h * 0.24, 52 * k);
      txt(g, cd.s, cx - bs * 1.55, cy, bs, '#7A6BD6', 800, FAMILY_EN);
      txt(g, '+', cx - bs * 0.62, cy, bs * 0.7, C.inkSoft, 800);
      txt(g, cd.y, cx + bs * 0.22, cy, bs, '#C05A54', 800, FAMILY_EN);
      txt(g, '=', cx + bs * 1.15, cy, bs * 0.7, C.inkSoft, 800);
      txt(g, '?', cx + bs * 1.62, cy, bs * 0.9, C.orange, 800);
    } else if (cd.type === 'decompose') {
      var ds = Math.min(r.h * 0.17, 40 * k);
      txt(g, String(cd.total), cx, r.y + r.h * 0.34, ds * 1.5, C.ink, 800);
      g.strokeStyle = '#E2D3C0';
      g.lineWidth = 2.5 * k;
      g.beginPath();
      g.moveTo(cx, r.y + r.h * 0.50);
      g.lineTo(cx - 46 * k, r.y + r.h * 0.64);
      g.moveTo(cx, r.y + r.h * 0.50);
      g.lineTo(cx + 46 * k, r.y + r.h * 0.64);
      g.stroke();
      txt(g, String(cd.part), cx - 46 * k, r.y + r.h * 0.78, ds * 1.2, C.blue, 800);
      txt(g, '?', cx + 46 * k, r.y + r.h * 0.78, ds * 1.2, C.orange, 800);
    } else if (cd.type === 'poem') {
      txt(g, cd.title + ' · ' + cd.author, cx, r.y + r.h * 0.30, Math.min(15 * k, 16), C.inkSoft, 700);
      txt(g, cd.line, cx, r.y + r.h * 0.58, Math.min(r.w * 0.10, 30 * k), C.ink, 800);
      txt(g, '🔊 点一下再听一遍', cx, r.y + r.h * 0.83, 11.5 * k, C.inkFaint, 700);
    } else if (cd.type === 'rhyme') {
      var rl = cd.line.replace('__', '＿');
      txt(g, rl, cx, cy, Math.min((r.w - 56 * k) / Math.max(rl.length, 6), 26 * k), C.ink, 800);
      txt(g, '🔊 点一下再听一遍', cx, r.y + r.h * 0.82, 11.5 * k, C.inkFaint, 700);
    } else if (cd.type === 'clock') {
      drawClock(g, cx, cy, Math.min(r.h * 0.36, 96 * k), cd.hour);
    } else if (cd.type === 'emoji') {
      emoji(g, cd.emoji, cx, cy + 2, Math.min(r.h * 0.50, 118 * k));
    } else if (cd.type === 'char') {
      txt(g, cd.pinyin, cx, r.y + r.h * 0.30, 20 * k, C.inkSoft, 700);
      txt(g, cd.char, cx, r.y + r.h * 0.64, Math.min(r.h * 0.50, 132 * k), C.ink, 800);
    } else if (cd.type === 'word') {
      txt(g, cd.word, cx, r.y + r.h * 0.48, Math.min(r.h * 0.30, 70 * k), C.ink, 800, FAMILY_EN);
    } else if (cd.type === 'letter') {
      txt(g, '大写', cx, r.y + r.h * 0.28, 15 * k, C.inkSoft, 700);
      txt(g, cd.up, cx, r.y + r.h * 0.60, Math.min(r.h * 0.44, 116 * k), C.ink, 800, FAMILY_EN);
    } else if (cd.type === 'count') {
      var n = cd.n, gapE = 6 * k;
      var size = Math.min(r.h * 0.36, (r.w - 70 * k - (n - 1) * gapE) / n);
      var totalW = n * size + (n - 1) * gapE;
      var x0 = cx - totalW / 2 + size / 2;
      for (var i = 0; i < n; i++) emoji(g, cd.emoji, x0 + i * (size + gapE), cy, size * 0.95);
    } else if (cd.type === 'add') {
      var size2 = Math.min(r.h * 0.34, 64 * k);
      var toks = [];
      for (var a = 0; a < cd.a; a++) toks.push({ t: 'e', v: cd.emoji });
      toks.push({ t: 's', v: '+' });
      for (var b = 0; b < cd.b; b++) toks.push({ t: 'e', v: cd.emoji });
      toks.push({ t: 's', v: '=' });
      toks.push({ t: 's', v: '?' });
      drawTokens(g, toks, cx, cy, size2, r.w - 40 * k);
    } else if (cd.type === 'sub') {
      var size3 = Math.min(r.h * 0.26, 52 * k);
      var n3 = cd.total, gap3 = size3 * 0.18;
      var totalW3 = n3 * size3 + (n3 - 1) * gap3;
      var x3 = cx - totalW3 / 2 + size3 / 2;
      var y3 = cy - 8 * k;
      for (var s3 = 0; s3 < n3; s3++) {
        g.save();
        if (s3 >= n3 - cd.eaten) g.globalAlpha = 0.26;
        emoji(g, cd.emoji, x3 + s3 * (size3 + gap3), y3, size3 * 0.95);
        g.restore();
      }
      txt(g, '吃掉了 ' + cd.eaten + ' 个', cx, y3 + size3 * 0.86, 13 * k, C.inkSoft, 700);
    } else if (cd.type === 'groups') {
      var halfW = r.w / 2 - 12 * k;
      var g1x = r.x + 10 * k, g2x = cx + 2 * k;
      groupsPane(g, g1x, r.y + 46 * k, halfW, r.h - 76 * k, cd.left, '左边');
      groupsPane(g, g2x, r.y + 46 * k, halfW, r.h - 76 * k, cd.right, '右边');
      g.save();
      g.setLineDash([5 * k, 6 * k]);
      g.strokeStyle = '#E8D8C2';
      g.lineWidth = 2;
      g.beginPath(); g.moveTo(cx, r.y + 58 * k); g.lineTo(cx, r.y + r.h - 22 * k); g.stroke();
      g.restore();
    } else if (cd.type === 'pattern') {
      var size4 = Math.min(r.h * 0.32, 58 * k);
      var toks2 = cd.items.map(function (e) { return { t: 'e', v: e }; });
      toks2.push({ t: 's', v: '?' });
      drawTokens(g, toks2, cx, cy, size4, r.w - 40 * k);
    } else if (cd.type === 'seq') {
      var size5 = Math.min(r.h * 0.30, 54 * k);
      var toks3 = cd.nums.map(function (n2) { return { t: 's', v: cnNum(n2) }; });
      toks3.push({ t: 's', v: '?' });
      drawTokens(g, toks3, cx, cy, size5, r.w - 50 * k);
    } else if (cd.type === 'none') {
      txt(g, cd.hint || '👀', cx, r.y + r.h * 0.34, 44 * k, C.inkSoft, 700);
    }
  }

  function groupsPane(g, x, y, w, h, grp, label) {
    var n = grp.n;
    var cols = n > 5 ? 3 : n;
    var rows = Math.ceil(n / cols);
    var gapE = 4 * k;
    var size = Math.min((w - 8 - (cols - 1) * gapE) / cols, (h - 16 - (rows - 1) * gapE) / rows, 40 * k);
    size = Math.max(size, 14);
    var totalW = cols * size + (cols - 1) * gapE;
    var totalH = rows * size + (rows - 1) * gapE;
    var sx = x + (w - totalW) / 2 + size / 2;
    var sy = y + (h - totalH) / 2 + size / 2;
    for (var i = 0; i < n; i++) {
      var c = i % cols, rIdx = Math.floor(i / cols);
      emoji(g, grp.emoji, sx + c * (size + gapE), sy + rIdx * (size + gapE), size * 0.95);
    }
    txt(g, label, x + w / 2, y + h + 6 * k, 12 * k, C.inkFaint, 700);
  }

  function drawTokens(g, toks, cx, cy, size, maxW) {
    var gap = size * 0.22;
    var widths = toks.map(function (tk) { return tk.t === 'e' ? size : size * (tk.v.length > 1 ? 0.72 : 0.52); });
    var total = widths.reduce(function (a, b) { return a + b; }, 0) + gap * (toks.length - 1);
    var scale = total > maxW ? maxW / total : 1;
    var x = cx - (total * scale) / 2;
    for (var i = 0; i < toks.length; i++) {
      var w = widths[i] * scale;
      if (toks[i].t === 'e') {
        emoji(g, toks[i].v, x + w / 2, cy, size * scale * 0.95);
      } else {
        txt(g, toks[i].v, x + w / 2, cy, size * scale * 0.86, toks[i].v === '?' ? C.orange : C.inkSoft, 800);
      }
      x += w + gap * scale;
    }
  }

  function drawOption(g, opt, r, i) {
    var isWrong = cur && cur.wrong[i];
    var isRight = cur && cur.done && i === cur.q.answer;
    var shaking = shake.i === i && shake.t > 0;
    var dx = shaking ? Math.sin(shake.t * 60) * 6 * k * (shake.t / 0.35) : 0;
    var fill = C.paper, line = C.line;
    if (isWrong) { fill = '#F6F1EA'; line = '#E6DACB'; }
    if (isRight) { fill = '#E9F8EC'; line = '#8FD3A0'; }

    g.save();
    g.translate(dx, 0);
    card(g, r.x, r.y, r.w, r.h, 20, fill, line, isRight ? 0.06 : 0.14);

    // 序号徽章
    g.fillStyle = isRight ? '#8FD3A0' : (isWrong ? '#E4D8C8' : '#F7EBDC');
    g.beginPath();
    g.arc(r.x + 26 * k, r.y + r.h / 2, 13 * k, 0, Math.PI * 2);
    g.fill();
    txt(g, String(i + 1), r.x + 26 * k, r.y + r.h / 2 + 1, 14 * k, isRight ? '#FFFFFF' : C.inkSoft, 800);

    var contentCx = r.x + r.w / 2 + 10 * k;
    var cy = r.y + r.h / 2;

    if (opt.type === 'char') {
      txt(g, opt.pinyin, contentCx, cy - r.h * 0.30, 12 * k, C.inkSoft, 700);
      txt(g, opt.char, contentCx, cy + r.h * 0.13, Math.min(r.h * 0.44, 48 * k), C.ink, 800);
    } else if (opt.type === 'emoji') {
      if (opt.label) {
        emoji(g, opt.emoji, contentCx - 30 * k, cy, Math.min(r.h * 0.60, 56 * k));
        txtLeft(g, opt.label, contentCx - 2 * k, cy + 2, Math.min(r.h * 0.26, 23 * k), C.inkSoft, 700);
      } else {
        emoji(g, opt.emoji, contentCx, cy, Math.min(r.h * 0.66, 62 * k));
      }
    } else if (opt.type === 'number') {
      txt(g, String(opt.n), contentCx, cy + 2, Math.min(r.h * 0.60, 58 * k), C.ink, 800);
    } else if (opt.type === 'letter') {
      txt(g, opt.ch, contentCx, cy + 2, Math.min(r.h * 0.60, 58 * k), C.ink, 800, FAMILY_EN);
    } else if (opt.type === 'text') {
      if (opt.emoji) {
        emoji(g, opt.emoji, contentCx - 34 * k, cy, Math.min(r.h * 0.44, 40 * k));
        txtLeft(g, opt.text, contentCx - 8 * k, cy + 1, Math.min(r.h * 0.30, 24 * k), C.ink, 800);
      } else {
        txt(g, opt.text, contentCx, cy + 1, Math.min(r.h * 0.32, 26 * k), C.ink, 800);
      }
    } else if (opt.type === 'swatch') {
      var sw = Math.min(r.h * 0.34, 52 * k);
      g.save();
      g.fillStyle = opt.hex;
      rr(g, contentCx - sw / 2, cy - sw / 2, sw, sw, sw * 0.28);
      g.fill();
      g.strokeStyle = 'rgba(74,54,38,0.22)';
      g.lineWidth = 2;
      rr(g, contentCx - sw / 2, cy - sw / 2, sw, sw, sw * 0.28);
      g.stroke();
      g.restore();
    } else if (opt.type === 'pinyin') {
      txt(g, opt.text, contentCx, cy + 2, Math.min(r.h * 0.40, 42 * k), C.ink, 800, FAMILY_EN);
    } else if (opt.type === 'shape') {
      drawShape(g, opt.shape, contentCx, cy, Math.min(r.h * 0.38, 34 * k), ['#F7A6B8', '#7FC8E8', '#F5C36B', '#9BD4A6'][i % 4]);
    }

    // 判对/判错标记
    if (isRight) {
      g.fillStyle = '#5FAE74';
      g.beginPath(); g.arc(r.x + r.w - 26 * k, r.y + r.h / 2, 14 * k, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#FFFFFF';
      g.lineWidth = 3.2 * k;
      g.lineCap = 'round';
      g.lineJoin = 'round';
      var cxx = r.x + r.w - 26 * k, cyy = r.y + r.h / 2;
      g.beginPath();
      g.moveTo(cxx - 6 * k, cyy);
      g.lineTo(cxx - 1.5 * k, cyy + 5 * k);
      g.lineTo(cxx + 6.5 * k, cyy - 5 * k);
      g.stroke();
    }
    if (isWrong) {
      g.strokeStyle = '#C4B2A0';
      g.lineWidth = 3 * k;
      g.lineCap = 'round';
      var wx = r.x + r.w - 26 * k, wy = r.y + r.h / 2;
      g.beginPath();
      g.moveTo(wx - 6 * k, wy - 6 * k); g.lineTo(wx + 6 * k, wy + 6 * k);
      g.moveTo(wx + 6 * k, wy - 6 * k); g.lineTo(wx - 6 * k, wy + 6 * k);
      g.stroke();
    }
    g.restore();
  }

  function drawPlaying() {
    var g = ctx;
    var q = cur.q;

    // 题卡
    card(g, ui.card.x, ui.card.y, ui.card.w, ui.card.h, 26, C.paper, '#F6E7D3', 0.13);
    if (q.card.type === 'none') {
      txt(g, q.prompt, ui.card.x + ui.card.w / 2, ui.card.y + ui.card.h * 0.52, Math.min(32 * k, ui.card.h * 0.26), C.ink, 800);
    } else {
      txt(g, q.prompt, ui.card.x + ui.card.w / 2, ui.card.y + 24 * k, Math.min(17 * k, 16 * k), C.inkSoft, 700);
      drawCardContent(g, q, ui.card);
    }

    // 喇叭（只有英语单词卡需要这一条胶囊）
    if (ui.speaker && q.card.type === 'word') {
      var sp = ui.speaker;
      card(g, sp.x, sp.y, sp.w, sp.h, 19, '#EAF6FF', '#CFE9F7', 0.05);
      emoji(g, '🔊', sp.x + 30 * k, sp.y + sp.h / 2, 17 * k);
      txt(g, '再听一遍', sp.x + sp.w / 2 + 10 * k, sp.y + sp.h / 2 + 1, 14 * k, '#3E8FBF', 800);
    }

    for (var i = 0; i < ui.opts.length; i++) drawOption(g, q.options[i], ui.opts[i], i);
  }

  function drawTitle() {
    var g = ctx;
    // 顶部：总星星 + 家长齿轮

  /* ---------- 学习周报 ---------- */
  function reportData() {
    var thisWeek = sumRange(daysBack(7, 0));
    var lastWeek = sumRange(daysBack(7, 7));
    var keys = daysBack(7, 0).slice().reverse();
    var bars = keys.map(function (key) {
      var e = save.days[key];
      var d = new Date(key.replace(/-/g, '/'));
      return {
        key: key,
        n: e ? (e.a || 0) : 0,
        wd: '日一二三四五六'.charAt(d.getDay())
      };
    });
    return {
      wk: thisWeek,
      pw: lastWeek,
      bars: bars,
      rate: thisWeek.a ? Math.round(thisWeek.c / thisWeek.a * 100) : 0,
      range: keys[0].slice(5).replace('-', '.') + ' – ' + keys[6].slice(5).replace('-', '.')
    };
  }

  function reportText() {
    var d = reportData();
    var lines = [];
    lines.push('【星星课堂 · 学习周报】' + d.range);
    lines.push('打卡 ' + d.wk.days + '/7 天 · 答题 ' + d.wk.a + ' 道 · 一次答对 ' + d.wk.c + ' 道（' + d.rate + '%）');
    lines.push('新认识汉字 ' + d.wk.l.length + ' 个' + (d.wk.l.length ? '：' + d.wk.l.slice(0, 20).join(' ') : ''));
    lines.push('新学英语单词 ' + d.wk.w.length + ' 个' + (d.wk.w.length ? '：' + d.wk.w.slice(0, 15).join(' ') : ''));
    lines.push('错题本还有 ' + save.wrong.length + ' 道待复习');
    lines.push('累计已认汉字 ' + countKeys(save.learnedChars) + '/' + CHARS.length + '，单词 ' + countKeys(save.learnedWords) + '/' + WORDS.length);
    return lines.join('\n');
  }

  function drawReport(g, W, H, kk, forExport) {
    var pad = 12;
    var px = pad, py = forExport ? 0 : 18, pw = W - pad * 2, ph = forExport ? H : H - 36;

    g.save();
    if (!forExport) {
      g.fillStyle = 'rgba(60,40,20,0.45)';
      g.fillRect(0, 0, W, H);
    } else {
      var bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#FFF6E4');
      bg.addColorStop(1, '#FDE9CC');
      g.fillStyle = bg;
      g.fillRect(0, 0, W, H);
    }
    card(g, px, py, pw, ph, 24, C.paper, null, 0.16);

    var d = reportData();
    var L = px + 20 * kk;
    var R = px + pw - 20 * kk;
    var innerW = R - L;
    var cx = (L + R) / 2;

    // 标题
    txtLeft(g, '学习周报', L, py + 34 * kk, 21 * kk, C.ink, 800);
    g.save();
    g.font = '700 ' + Math.round(11 * kk) + 'px ' + FAMILY;
    g.fillStyle = C.inkSoft;
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    g.fillText(d.range, R, py + 35 * kk);
    g.restore();
    g.fillStyle = '#F3E7D6';
    g.fillRect(L, py + 50 * kk, innerW, 1.5);

    // 四宫格数字
    var gy = py + 62 * kk, gh = 60 * kk, gw = (innerW - 10) / 2;
    var boxes = [
      ['打卡', d.wk.days + '/7', '天', '#F08A4B'],
      ['答题', String(d.wk.a), '道', '#4FA9DE'],
      ['正确率', String(d.rate), '%', '#6FBE84'],
      ['新认字', String(d.wk.l.length), '个', '#C05A54']
    ];
    for (var i2 = 0; i2 < 4; i2++) {
      var bx = L + (i2 % 2) * (gw + 10);
      var by = gy + Math.floor(i2 / 2) * (gh + 8);
      card(g, bx, by, gw, gh, 14, '#FFF9F0', '#F3E7D6', 0);
      txtLeft(g, boxes[i2][0], bx + 12 * kk, by + 19 * kk, 10.5 * kk, C.inkSoft, 700);
      txt(g, boxes[i2][1], bx + gw * 0.62, by + 35 * kk, 19 * kk, boxes[i2][3], 800);
      txtLeft(g, boxes[i2][2], bx + gw * 0.62 + String(boxes[i2][1]).length * 6.6 * kk + 3 * kk, by + 39 * kk, 9 * kk, C.inkFaint, 700);
    }

    // 7 天柱状图
    var chY = gy + gh * 2 + 24 * kk;
    txtLeft(g, '这 7 天答了多少题', L, chY, 10.5 * kk, C.inkSoft, 800);
    var barTop = chY + 14 * kk, barH = 54 * kk;
    var maxN = 1;
    d.bars.forEach(function (b) { if (b.n > maxN) maxN = b.n; });
    var bw = (innerW - 6 * 6) / 7;
    for (var b2 = 0; b2 < 7; b2++) {
      var bx2 = L + b2 * (bw + 6);
      var bh = barH * (d.bars[b2].n / maxN);
      g.fillStyle = '#F4EADC';
      rr(g, bx2, barTop, bw, barH, 4);
      g.fill();
      if (d.bars[b2].n > 0) {
        g.fillStyle = b2 === 6 ? '#F2914F' : '#F7C98B';
        rr(g, bx2, barTop + barH - Math.max(bh, 3), bw, Math.max(bh, 3), 4);
        g.fill();
      }
      txt(g, d.bars[b2].wd, bx2 + bw / 2, barTop + barH + 10 * kk, 8.5 * kk, C.inkFaint, 700);
    }

    // 新认识的字
    var sy = barTop + barH + 30 * kk;
    txtLeft(g, '新认识 ' + d.wk.l.length + ' 个字', L, sy, 11.5 * kk, C.ink, 800);
    var chips = d.wk.l.slice(0, 14);
    var cy2 = sy + 15 * kk;
    if (!chips.length) {
      txtLeft(g, '还没开始，来玩一局吧～', L, cy2 + 8 * kk, 10 * kk, C.inkFaint, 700);
    } else {
      var cw = 22 * kk, cgap = 5 * kk, perRow = 8;
      for (var c2 = 0; c2 < chips.length; c2++) {
        var col = c2 % perRow, row = Math.floor(c2 / perRow);
        var cxp = L + col * (cw + cgap), cyp = cy2 + row * (cw + cgap);
        card(g, cxp, cyp, cw, cw, 6, '#FFF3E2', '#F2DDC2', 0);
        txt(g, chips[c2], cxp + cw / 2, cyp + cw / 2 + 1 * kk, 13 * kk, C.ink, 800);
      }
    }

    // 新学的单词
    var wy = cy2 + (chips.length > 8 ? 2 : 1) * (22 * kk + 5 * kk) + 10 * kk;
    txtLeft(g, '新学 ' + d.wk.w.length + ' 个单词', L, wy, 11.5 * kk, C.ink, 800);
    txtLeft(g, d.wk.w.length ? d.wk.w.slice(0, 7).join(' · ') : '—', L, wy + 15 * kk, 10 * kk, C.inkSoft, 700);

    // 时间花在
    var ky = wy + 36 * kk;
    txtLeft(g, '时间花在', L, ky, 10.5 * kk, C.inkSoft, 800);
    var subs = [];
    for (var s3 in d.wk.s) {
      if (!d.wk.s.hasOwnProperty(s3) || !d.wk.s[s3]) continue;
      subs.push([s3, d.wk.s[s3]]);
    }
    subs.sort(function (a, b) { return b[1] - a[1]; });
    subs = subs.slice(0, 4);
    var totalS = 0;
    subs.forEach(function (x) { totalS += x[1]; });
    if (!subs.length) {
      txtLeft(g, '这周还没有数据', L, ky + 16 * kk, 9.5 * kk, C.inkFaint, 700);
    }
    for (var s4 = 0; s4 < subs.length; s4++) {
      var ry = ky + 12 * kk + s4 * 14 * kk;
      var m = MODES[subs[s4][0]] || { name: subs[s4][0], color: C.inkSoft };
      txtLeft(g, m.name, L, ry + 4 * kk, 9.5 * kk, C.inkSoft, 700);
      var trackX = L + 34 * kk, trackW = innerW - 74 * kk;
      g.fillStyle = '#F4EADC';
      rr(g, trackX, ry, trackW, 7 * kk, 3.5 * kk);
      g.fill();
      g.fillStyle = m.color || C.orange;
      rr(g, trackX, ry, Math.max(trackW * (subs[s4][1] / totalS), 6 * kk), 7 * kk, 3.5 * kk);
      g.fill();
      txt(g, String(subs[s4][1]), R, ry + 4 * kk, 9 * kk, C.inkFaint, 700);
    }

    // 错题
    var fy = ky + 12 * kk + Math.max(subs.length, 1) * 14 * kk + 18 * kk;
    card(g, L, fy, innerW, 46 * kk, 12, '#FBE7E5', null, 0);
    txtLeft(g, '错题本还有 ' + save.wrong.length + ' 道', L + 12 * kk, fy + 16 * kk, 10.5 * kk, '#B4574F', 800);
    var wl = save.wrong.slice(0, 4).map(function (w) {
      var q = w.q || {}, tag = q.tag || {};
      if (tag.kind === 'char') return tag.key;
      if (tag.kind === 'word') return tag.key;
      return MODES[q.sub] ? MODES[q.sub].name : '题目';
    });
    txtLeft(g, wl.length ? '还要再练：' + wl.join(' · ') : '本周没有错题，很棒！', L + 12 * kk, fy + 32 * kk, 8.8 * kk, '#C98A85', 700);

    // 累计
    txtLeft(g, '累计已认汉字 ' + countKeys(save.learnedChars) + '/' + CHARS.length +
      ' · 单词 ' + countKeys(save.learnedWords) + '/' + WORDS.length, L, fy + 66 * kk, 9 * kk, C.inkFaint, 700);

    // 一句话 + 对比
    var msg = d.wk.days >= 6 ? '几乎每天都来，太厉害啦！' :
      (d.wk.days >= 3 ? '这周坚持得不错，继续保持！' :
        (d.wk.days >= 1 ? '已经开始了，明天再来一会儿。' : '这周还没开始，来玩一局吧～'));
    txt(g, msg, cx, fy + 92 * kk, 11 * kk, C.inkSoft, 700);
    if (d.pw.a > 0) {
      var diff = d.wk.a - d.pw.a;
      var cmp = (diff >= 0 ? '比上周多答 ' : '比上周少答 ') + Math.abs(diff) + ' 道';
      txt(g, cmp, cx, fy + 112 * kk, 9 * kk, C.inkFaint, 700);
    }

    // 按钮（只有屏上要）
    if (!forExport) {
      for (var b3 = 0; b3 < ui.reportBtns.length; b3++) {
        var btn = ui.reportBtns[b3];
        var primary = btn.id === 'save';
        if (btn.id === 'close') {
          card(g, btn.x, btn.y, btn.w, btn.h, 16, '#F7F1E8', '#EADCCB', 0.04);
          txt(g, '关闭', btn.x + btn.w / 2, btn.y + btn.h / 2 + 1, 13 * kk, C.inkSoft, 800);
        } else {
          card(g, btn.x, btn.y, btn.w, btn.h, 16, primary ? '#F2914F' : '#EAF1FB', primary ? '#D96E2E' : '#B9CFEA', 0.06);
          txt(g, primary ? '存成图片' : '复制文字', btn.x + btn.w / 2, btn.y + btn.h / 2 + 1, 14 * kk, primary ? '#FFFFFF' : '#3E6FA8', 800);
        }
      }
    }
    g.restore();
  }

  function toast(msg) {
    state.toast = { text: msg, t: 2.2 };
  }

  function saveReportImage() {
    try {
      var W = 390, H = 844, S = 2;
      var c = document.createElement('canvas');
      c.width = W * S; c.height = H * S;
      var g = c.getContext('2d');
      g.setTransform(S, 0, 0, S, 0, 0);
      drawReport(g, W, H, 1, true);
      var a = document.createElement('a');
      a.download = '星星课堂-学习周报-' + dayKey() + '.png';
      a.href = c.toDataURL('image/png');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast('已存成图片，在「下载」文件夹里');
    } catch (e) {
      toast('这张图存不下来，直接截图也可以');
    }
  }

  function copyReportText() {
    var text = reportText();
    var done = function () { toast('文字已复制，去微信粘贴吧'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { toast('复制不了，可以截图分享'); });
        return;
      }
    } catch (e) { /* 落到下面的兜底 */ }
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) {
      toast('复制不了，可以截图分享');
    }
  }

  function drawParticles() {
    var g = ctx;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      g.save();
      g.globalAlpha = Math.max(0, p.life);
      g.translate(p.x, p.y);
      g.rotate(p.rot);
      g.fillStyle = p.color;
      if (p.kind === 'star') {
        drawStar(g, 0, 0, p.size, p.color);
      } else {
        rr(g, -p.size / 2, -p.size / 2, p.size, p.size * 0.7, 2);
        g.fill();
      }
      g.restore();
    }
  }

  /* ============================================================
   * 10. 主循环
   * ============================================================ */
  function update(dt) {
    t += dt;
    if (starPop > 0) starPop -= dt * 2.2;
    if (state.anim && state.anim.running) {
      state.anim.t += dt;
      var _q = state.teachQueue && state.teachQueue[state.teachIdx];
      var _n = (_q && STROKES[_q.char]) ? STROKES[_q.char].length : 0;
      if (state.anim.t > 0.35 + Math.min(_n * 0.40, 3.4) + 0.4) state.anim.running = false;
    }
    if (state.toast) { state.toast.t -= dt; if (state.toast.t <= 0) state.toast = null; }
    if (shake.t > 0) shake.t -= dt;

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt * 0.9;
      p.vy += 620 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (pending) {
      pending.t -= dt;
      if (pending.t <= 0) {
        var fn = pending.fn;
        pending = null;
        fn();
      }
    }
  }

  function render() {
    var g = ctx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawSky(g);
    g.save();
    g.translate(vx, vy);
    layout();
    if (state.phase === 'title') {
      drawTitle();
    } else if (state.phase === 'teach') {
      drawTopBar();
      drawTeach();
    } else if (state.phase === 'playing') {
      drawTopBar();
      drawPlaying();
    } else if (state.phase === 'won') {
      drawTopBar();
      drawWon();
    } else if (state.phase === 'parent') {
      drawTitle();
      drawParent();
    } else if (state.phase === 'report') {
      drawTitle();
      drawReport(g, vw, vh, k, false);
    }
    drawParticles();
    if (state.toast) {
      var tw = Math.min(vw - 48, 300);
      var ty = vh - 150;
      card(g, vw / 2 - tw / 2, ty, tw, 40, 20, 'rgba(74,54,38,0.92)', null, 0.12);
      txt(g, state.toast.text, vw / 2, ty + 21, 12.5 * k, '#FFFFFF', 700);
    }
    g.restore();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastT) lastT = now;
    var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
    lastT = now;
    fpsFrames++; fpsAccum += dt;
    if (fpsAccum >= 0.5) { fps = Math.round(fpsFrames / fpsAccum); fpsFrames = 0; fpsAccum = 0; }
    update(dt);
    render();
  }

  /* ============================================================
   * 11. 流程
   * ============================================================ */
  function countSubjects(qs) {
    var c = {};
    for (var i = 0; i < qs.length; i++) c[qs[i].sub] = (c[qs[i].sub] || 0) + 1;
    return c;
  }

  /* ---------- 识字：先教后练 ---------- */
  function teachCount() {
    return Math.max(2, Math.min(3, NQ - 4));
  }

  /* 选这一轮要教的字：先补错过的，再挑没学过的 */
  function pickTeachChars(n) {
    var pool = poolChars();
    var out = [];
    var wrongChars = [];
    save.wrong.forEach(function (w) {
      var q = w.q || {};
      if (q.tag && q.tag.kind === 'char' && wrongChars.indexOf(q.tag.key) < 0) wrongChars.push(q.tag.key);
    });
    wrongChars.forEach(function (ch) {
      if (out.length >= n) return;
      var hitItem = null;
      for (var i = 0; i < pool.length; i++) if (pool[i].char === ch) { hitItem = pool[i]; break; }
      if (hitItem) out.push(hitItem);
    });
    var fresh = shuffle(pool.filter(function (c) {
      return !save.learnedChars[c.char] && !out.some(function (o) { return o.char === c.char; });
    }));
    while (out.length < n && fresh.length) out.push(fresh.shift());
    var rest = shuffle(pool);
    while (out.length < n && rest.length) {
      var r = rest.shift();
      if (!out.some(function (o) { return o.char === r.char; })) out.push(r);
    }
    return out;
  }

  function startLitRound() {
    state.mode = 'lit';
    state.phase = 'teach';
    state.teachQueue = pickTeachChars(teachCount());
    state.teachIdx = 0;
    state.strokes = [];
    state.drawing = false;
    state.questions = [];
    state.counts = {};
    state.qi = 0;
    state.stars = 0;
    state.firstTry = 0;
    state.wrongCount = 0;
    cur = null;
    pending = null;
    layoutTeach();
    showTeach();
  }

  function showTeach() {
    var item = state.teachQueue[state.teachIdx];
    if (!item) { startLitQuiz(); return; }
    state.phase = 'teach';
    state.strokes = [];
    state.drawing = false;
    state.teachShownAt = t;
    state.anim = { t: RULES.debugAnimFast ? 99 : 0, running: !RULES.debugAnimFast, delay: 0.35 };
    layoutTeach();
    say(item.char + '，' + item.word + '的' + item.char + '。' + (item.sent || ''), 'zh-CN', true);
  }

  function nextTeach() {
    state.teachIdx++;
    if (state.teachIdx >= state.teachQueue.length) { startLitQuiz(); return; }
    showTeach();
  }

  /* 教完再练：先出刚教的字，其余只从「已经学过的字」里抽 */
  function startLitQuiz() {
    var qs = [];
    state.teachQueue.forEach(function (c) {
      var q = makeLit(c);
      if (q) qs.push(q);
    });
    var learned = poolChars().filter(function (c) { return save.learnedChars[c.char]; });
    var guard = 0;
    while (qs.length < NQ && learned.length && guard++ < 40) {
      var q2 = makeLit(pick(learned));
      if (q2 && !qs.some(function (x) { return x.id === q2.id; })) qs.push(q2);
    }
    guard = 0;
    while (qs.length < NQ && guard++ < 40) {
      var q3 = makeLit();
      if (q3 && !qs.some(function (x) { return x.id === q3.id; })) qs.push(q3);
    }
    state.questions = shuffle(qs.slice(0, NQ));
    state.counts = countSubjects(state.questions);
    state.qi = 0;
    state.phase = 'playing';
    startQuestion();
  }

  function layoutTeach() {
    var pad = ui.pad;
    var box = Math.min(vw - pad * 2 - 24 * k, vh * 0.36, 320 * k);
    var gx = (vw - box) / 2;
    // 整块内容（标题 + 格子 + 拼音 + 组词 + 例句 + 按钮）在顶栏以下居中
    var blockH = 44 * k + box + 34 * k + 30 * k + 46 * k + 54 * k;
    var gy = ui.topH + Math.max(16 * k, (vh - ui.topH - blockH) / 2) + 22 * k;
    var btnW = (vw - pad * 2 - 26) / 2;
    var btnY = gy + box + 34 * k + 30 * k + 46 * k + 12 * k;
    ui.teach = {
      grid: { x: gx, y: gy, w: box, h: box },
      replay: { x: gx + box - 82 * k, y: gy + 12 * k, w: 70 * k, h: 30 * k },
      btnRead: { x: pad + 6, y: btnY, w: btnW, h: 48 * k },
      btnNext: { x: pad + 20 + btnW, y: btnY, w: btnW, h: 48 * k }
    };
  }

  /* 沿中线逐笔画出字形，frac<1 时只画到该比例 */
  function drawMedian(g, pts, frac, cx, cy, S) {
    if (!pts || !pts.length) return;
    var m = [];
    for (var i = 0; i < pts.length; i++) m.push([cx + (pts[i][0] - 515) * S, cy - (pts[i][1] - 395) * S]);
    if (m.length === 1) {
      g.beginPath();
      g.arc(m[0][0], m[0][1], g.lineWidth * 0.45, 0, Math.PI * 2);
      g.fill();
      return;
    }
    if (frac >= 1) {
      g.beginPath();
      g.moveTo(m[0][0], m[0][1]);
      for (var a = 1; a < m.length; a++) g.lineTo(m[a][0], m[a][1]);
      g.stroke();
      return;
    }
    var lens = [], total = 0;
    for (var b = 1; b < m.length; b++) {
      var dx = m[b][0] - m[b - 1][0], dy = m[b][1] - m[b - 1][1];
      var L = Math.sqrt(dx * dx + dy * dy);
      lens.push(L);
      total += L;
    }
    var target = total * frac, acc = 0;
    g.beginPath();
    g.moveTo(m[0][0], m[0][1]);
    for (var c = 1; c < m.length; c++) {
      var seg = lens[c - 1] || 0;
      if (acc + seg <= target) {
        g.lineTo(m[c][0], m[c][1]);
        acc += seg;
      } else {
        var r = seg ? (target - acc) / seg : 1;
        g.lineTo(m[c - 1][0] + (m[c][0] - m[c - 1][0]) * r, m[c - 1][1] + (m[c][1] - m[c - 1][1]) * r);
        break;
      }
    }
    g.stroke();
  }

  /* 田字格里的笔顺演示 */
  function drawStrokeOrder(g, ch, rect) {
    var med = STROKES[ch];
    var cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    var S = rect.w * 0.86 / 950;
    if (!med) {
      txt(g, ch, cx, cy + 3, Math.min(rect.w * 0.60, 210 * k), '#E8D8C0', 800);
      return;
    }
    var t = state.anim ? Math.max(0, state.anim.t - (state.anim.delay || 0)) : 999;
    var step = Math.min(0.40, 3.4 / Math.max(med.length, 1));
    var per = step * 0.78;
    var done = state.anim && state.anim.running === false;
    g.save();
    g.strokeStyle = done ? '#DFCBAB' : '#4A3626';
    g.fillStyle = done ? '#DFCBAB' : '#4A3626';
    g.lineWidth = Math.max(5 * k, Math.min(rect.w * 0.062, 300 * 0.062 * k));
    g.lineCap = 'round';
    g.lineJoin = 'round';
    for (var i = 0; i < med.length; i++) {
      var start = i * step;
      if (t < start) break;
      drawMedian(g, med[i], Math.min(1, (t - start) / per), cx, cy, S);
    }
    g.restore();
  }

  function drawTeach() {
    var g = ctx;
    if (!state.teachQueue || !state.teachQueue.length) return;
    var item = state.teachQueue[Math.min(state.teachIdx, state.teachQueue.length - 1)];
    var gr = ui.teach.grid;

    txt(g, '学新字 ' + (state.teachIdx + 1) + ' / ' + state.teachQueue.length,
      vw / 2, ui.topH + 44 * k, 14 * k, C.inkSoft, 700);

    // 田字格
    g.save();
    g.fillStyle = '#FFFDF8';
    rr(g, gr.x, gr.y, gr.w, gr.h, 18);
    g.fill();
    g.strokeStyle = '#EBDCC6';
    g.lineWidth = 2;
    rr(g, gr.x, gr.y, gr.w, gr.h, 18);
    g.stroke();

    g.setLineDash([6 * k, 8 * k]);
    g.strokeStyle = '#F0E1CC';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(gr.x + gr.w / 2, gr.y + 10);
    g.lineTo(gr.x + gr.w / 2, gr.y + gr.h - 10);
    g.moveTo(gr.x + 10, gr.y + gr.h / 2);
    g.lineTo(gr.x + gr.w - 10, gr.y + gr.h / 2);
    g.stroke();
    g.setLineDash([]);

    // 笔顺演示
    drawStrokeOrder(g, item.char, gr);

    // 手指描红
    g.strokeStyle = '#F2914F';
    g.fillStyle = '#F2914F';
    g.lineWidth = 9 * k;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    (state.strokes || []).forEach(function (s) {
      if (!s || !s.length) return;
      if (s.length === 1) {
        g.beginPath();
        g.arc(s[0].x, s[0].y, 4.5 * k, 0, Math.PI * 2);
        g.fill();
        return;
      }
      g.beginPath();
      g.moveTo(s[0].x, s[0].y);
      for (var i = 1; i < s.length; i++) g.lineTo(s[i].x, s[i].y);
      g.stroke();
    });
    g.restore();

    // 拼音 + 组词
    var pyY = gr.y + gr.h + 32 * k;
    txt(g, item.pinyin, vw / 2, pyY, 21 * k, C.ink, 800);
    var wdY = pyY + 28 * k;
    txt(g, item.word, vw / 2 - (item.emoji ? 18 * k : 0), wdY, 16 * k, C.inkSoft, 700);
    if (item.emoji) emoji(g, item.emoji, vw / 2 + 46 * k, wdY - 1, 22 * k);

    // 例句：最多两行
    if (item.sent) {
      var sl = wrapLines(g, item.sent, vw - ui.pad * 2 - 28 * k, 13 * k, 700).slice(0, 2);
      for (var li = 0; li < sl.length; li++) {
        txt(g, sl[li], vw / 2, wdY + 26 * k + li * 19 * k, 13 * k, C.ink, 700);
      }
    }

    // 重播笔顺
    card(g, ui.teach.replay.x, ui.teach.replay.y, ui.teach.replay.w, ui.teach.replay.h, 15, 'rgba(255,255,255,0.92)', '#EBDCC6', 0.04);
    txt(g, '▶ 笔顺', ui.teach.replay.x + ui.teach.replay.w / 2, ui.teach.replay.y + ui.teach.replay.h / 2 + 1, 11 * k, '#B98A55', 800);

    // 按钮
    card(g, ui.teach.btnRead.x, ui.teach.btnRead.y, ui.teach.btnRead.w, ui.teach.btnRead.h, 18, '#EAF6FF', '#CFE9F7', 0.05);
    emoji(g, '🔊', ui.teach.btnRead.x + 30 * k, ui.teach.btnRead.y + ui.teach.btnRead.h / 2, 16 * k);
    txt(g, '再听一遍', ui.teach.btnRead.x + ui.teach.btnRead.w / 2 + 12 * k, ui.teach.btnRead.y + ui.teach.btnRead.h / 2 + 1, 15 * k, '#3E8FBF', 800);

    card(g, ui.teach.btnNext.x, ui.teach.btnNext.y, ui.teach.btnNext.w, ui.teach.btnNext.h, 18, '#F2914F', '#D96E2E', 0.1);
    txt(g, '会了，下一个', ui.teach.btnNext.x + ui.teach.btnNext.w / 2, ui.teach.btnNext.y + ui.teach.btnNext.h / 2 + 1, 15 * k, '#FFFFFF', 800);
  }

  function handleTeachDown(x, y) {
    if (hit(ui.back, x, y)) { sfxTap(); toTitle(); return; }
    if (hit(ui.teach.btnRead, x, y)) {
      var item = state.teachQueue[state.teachIdx];
      if (item) say(item.char + '，' + item.word + '的' + item.char + '。' + (item.sent || ''), 'zh-CN', true);
      sfxTap();
      return;
    }
    if (hit(ui.teach.replay, x, y)) {
      state.anim = { t: 0, running: true, delay: 0 };
      sfxTap();
      return;
    }
    if (hit(ui.teach.btnNext, x, y)) { sfxTap(); nextTeach(); return; }
    if (hit(ui.teach.grid, x, y)) {
      state.drawing = true;
      state.strokes.push([{ x: x, y: y }]);
    }
  }

  function startRound(mode) {
    state.mode = mode || 'mix';
    if (state.mode === 'lit') { startLitRound(); return; }
    state.phase = 'playing';
    state.questions = buildRound(state.mode);
    state.counts = countSubjects(state.questions);
    state.qi = 0;
    state.stars = 0;
    state.firstTry = 0;
    state.wrongCount = 0;
    cur = null;
    pending = null;
    startQuestion();
  }

  function startReview() {
    if (!save.wrong.length) { toTitle(); return; }
    state.mode = 'review';
    state.phase = 'playing';
    state.questions = shuffle(save.wrong.slice()).slice(0, NQ).map(function (w) { return w.q; });
    state.counts = countSubjects(state.questions);
    state.qi = 0;
    state.stars = 0;
    state.firstTry = 0;
    state.wrongCount = 0;
    cur = null;
    pending = null;
    startQuestion();
  }

  function startQuestion() {
    if (state.qi >= state.questions.length) { finishRound(); return; }
    var q = state.questions[state.qi];
    cur = { q: q, wrong: {}, tries: 0, done: false, okT: 0, shownT: 0 };
    state.phase = 'playing';
    layout();
    if (q.say) say(q.say, q.sayLang || 'zh-CN');
  }

  function advance() {
    if (state.phase !== 'playing') return;
    cur = null;
    state.qi++;
    if (state.qi >= state.questions.length) { finishRound(); return; }
    startQuestion();
  }

  function finishRound() {
    state.phase = 'won';
    cur = null;
    sfxWin();
    burst(vw / 2, vh * 0.35, 46);
    save.total += state.stars;
    if (state.stars > save.best) save.best = state.stars;
    writeSave();
    say('太棒了，你收下了 ' + state.stars + ' 颗星星！', 'zh-CN', true);
  }

  function choose(i) {
    if (state.phase !== 'playing' || !cur || cur.done) return;
    var q = cur.q;
    if (i === q.answer) {
      cur.done = true;
      state.stars++;
      if (cur.tries === 0) state.firstTry++;
      recordAnswer(q, cur.tries === 0);
      if (q.tag && q.tag.kind === 'char') save.learnedChars[q.tag.key] = (save.learnedChars[q.tag.key] || 0) + 1;
      if (q.tag && q.tag.kind === 'word') save.learnedWords[q.tag.key] = (save.learnedWords[q.tag.key] || 0) + 1;
      if (state.mode === 'review') clearWrong(q.id);
      writeSave();
      starPop = 1;
      sfxCorrect();
      var r = ui.opts[i];
      burst(r.x + r.w / 2, r.y + r.h / 2, 16);
      say(q.praise, 'zh-CN', true);
      pending = { t: 1.25, fn: advance };
    } else {
      cur.wrong[i] = true;
      cur.tries++;
      state.wrongCount++;
      recordAnswer(q, false);
      addWrong(q);
      writeSave();
      shake.i = i;
      shake.t = 0.35;
      sfxWrong();
      say('再试一次', 'zh-CN', true);
    }
  }

  function burst(x, y, n) {
    var colors = ['#F2B33D', '#F2914F', '#7FC8E8', '#8FD3A0', '#F7A6B8', '#FFFFFF'];
    for (var i = 0; i < n; i++) {
      var ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.6;
      var sp = 120 + Math.random() * 260;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        rot: Math.random() * 6,
        vr: (Math.random() - 0.5) * 8,
        size: 4 + Math.random() * 6,
        color: pick(colors),
        life: 0.9 + Math.random() * 0.5,
        kind: Math.random() < 0.3 ? 'star' : 'bit'
      });
    }
  }

  function toTitle() {
    state.phase = 'title';
    cur = null;
    pending = null;
    particles.length = 0;
    layout();
  }

  /* ============================================================
   * 12. 输入
   * ============================================================ */
  function pt(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left - vx, y: e.clientY - rect.top - vy };
  }
  function hit(r, x, y) {
    return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  function handleTap(x, y) {
    ensureAudio();

    if (state.phase === 'report') {
      for (var rb = 0; rb < ui.reportBtns.length; rb++) {
        var rbtn = ui.reportBtns[rb];
        if (!hit(rbtn, x, y)) continue;
        sfxTap();
        if (rbtn.id === 'save') saveReportImage();
        else if (rbtn.id === 'copy') copyReportText();
        else state.phase = 'parent';
        return;
      }
      return;
    }

    if (state.phase === 'parent') {
      for (var b = 0; b < ui.parentBtns.length; b++) {
        var btn = ui.parentBtns[b];
        if (!hit(btn, x, y)) continue;
        sfxTap();
        if (btn.id === 'speech') { speechOn = !speechOn; if (!speechOn && window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} } }
        else if (btn.id === 'sound') { soundOn = !soundOn; if (soundOn) ensureAudio(); }
        else if (btn.id === 'count') { NQ = NQ === 6 ? 8 : (NQ === 8 ? 10 : 6); }
        else if (btn.id === 'level') { maxNumber = maxNumber >= 10 ? 5 : 10; }
        else if (btn.id === 'word') { state.wordLevel = state.wordLevel >= 3 ? 1 : state.wordLevel + 1; }
        else if (btn.id === 'review') { if (save.wrong.length) { startReview(); } else { state.phase = 'title'; } }
        else if (btn.id === 'report') { state.phase = 'report'; layout(); }
        else if (btn.id === 'close') { state.phase = 'title'; }
        layout();
        return;
      }
      return;
    }

    if (state.phase === 'title') {
      if (RULES.debugReview && save.wrong.length) { startReview(); return; }
      if (FORCED_MODE && MODES[FORCED_MODE]) {
        sfxTap();
        startRound(FORCED_MODE);
        return;
      }
      // 齿轮
      if (x >= vw - ui.pad - 34 && x <= vw - ui.pad && y >= 34 && y <= 68) {
        sfxTap();
        state.phase = 'parent';
        layout();
        return;
      }
      if (ui.reviewBtn && hit(ui.reviewBtn, x, y)) {
        sfxTap();
        startReview();
        return;
      }
      for (var i = 0; i < ui.titleBtns.length; i++) {
        if (hit(ui.titleBtns[i], x, y)) {
          sfxTap();
          startRound(ui.titleBtns[i].id);
          return;
        }
      }
      if (hit(ui.foxTitle, x, y)) {
        sfxTap();
        startRound('mix');
        return;
      }
      return;
    }

    if (state.phase === 'won') {
      for (var w = 0; w < ui.wonBtns.length; w++) {
        if (hit(ui.wonBtns[w], x, y)) {
          sfxTap();
          if (ui.wonBtns[w].id === 'again') startRound(state.mode);
          else toTitle();
          return;
        }
      }
      return;
    }

    if (state.phase === 'playing') {
      if (hit(ui.back, x, y)) { sfxTap(); toTitle(); return; }
      if (ui.speaker && hit(ui.speaker, x, y)) {
        var q0 = cur && cur.q;
        if (q0) say(q0.say || q0.card.word, q0.sayLang || 'zh-CN', true);
        sfxTap();
        return;
      }
      for (var o = 0; o < ui.opts.length; o++) {
        if (hit(ui.opts[o], x, y)) { choose(o); return; }
      }
    }
  }

  function onDown(x, y) {
    if (state.phase === 'teach') { handleTeachDown(x, y); return; }
    handleTap(x, y);
  }
  function onMove(x, y) {
    if (state.phase !== 'teach' || !state.drawing) return;
    var s = state.strokes[state.strokes.length - 1];
    if (s) s.push({ x: x, y: y });
  }
  function onUp() { state.drawing = false; }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var p = pt(e);
    onDown(p.x, p.y);
  }, { passive: false });
  canvas.addEventListener('pointermove', function (e) {
    var p = pt(e);
    onMove(p.x, p.y);
  });
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  document.addEventListener('keydown', function (e) {
    var key = e.key;
    if (key === 'Enter' || key === ' ') {
      e.preventDefault();
      if (state.phase === 'title') { startRound(FORCED_MODE || 'mix'); return; }
      if (state.phase === 'won') { startRound(FORCED_MODE || state.mode); return; }
    }
    if (key === 'Escape') {
      if (state.phase === 'playing' || state.phase === 'parent') toTitle();
      return;
    }
    var n = parseInt(key, 10);
    if (n >= 1 && n <= 4 && state.phase === 'playing' && cur) {
      if (n - 1 < ui.opts.length) choose(n - 1);
    }
  });

  window.addEventListener('resize', resize);

  /* ============================================================
   * 13. Game Studio 接口
   * ============================================================ */
  function emit(type, payload) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(Object.assign({ source: 'dsh-game-studio', type: type }, payload), '*');
      }
    } catch (e) {}
  }

  window.__gameState = function () {
    return {
      phase: (state.phase === 'parent') ? 'title' : (state.phase === 'teach' ? 'playing' : state.phase),
      score: save.total + state.stars,
      hearts: 3,
      fps: fps,
      hero: { x: vw / 2, y: ui.card ? ui.card.y + ui.card.h : vh / 2 },
      pickups: ui.opts.map(function (o) { return { x: o.x + o.w / 2, y: o.y + o.h / 2 }; }),
      enemies: [],
      world: { w: vw, h: vh },
      heroOnScreen: true
    };
  };

  var FORCED_MODE = RULES.autoMode ? String(RULES.autoMode) : '';
  var autoModes = FORCED_MODE ? [FORCED_MODE] : ['lit', 'pinyin', 'math', 'en', 'poem', 'rhyme', 'color', 'time', 'mix'];
  var autoModeIdx = 0;
  function autoMode() { return autoModes[(autoModeIdx++) % autoModes.length]; }
  window.__autoplay = function () {
    if (state.phase === 'title') {
      if (RULES.debugReview && save.wrong.length) { startReview(); return 'review'; }
      startRound(autoMode());
      return 'start';
    }
    if (state.phase === 'won') {
      if (pending) return 'wait';
      startRound(autoMode());
      return 'again';
    }
    if (state.phase === 'teach') {
      // 自动试玩也要在字卡上停一会儿，别一闪而过
      if (!state.teachShownAt) state.teachShownAt = t;
      var _q = state.teachQueue && state.teachQueue[state.teachIdx];
      var _n = (_q && STROKES[_q.char]) ? STROKES[_q.char].length : 0;
      if (t - state.teachShownAt < 0.35 + Math.min(_n * 0.40, 3.4) + 1.2) return 'look';
      nextTeach();
      return 'teach';
    }
    if (state.phase === 'playing' && cur && !cur.done) {
      if (!cur.shownT) cur.shownT = t;
      var waited = t - cur.shownT;
      if (RULES.debugWrong && !cur.triedWrong) {
        if (waited < 1.4) return 'read';
        cur.triedWrong = true;
        for (var wi = 0; wi < cur.q.options.length; wi++) {
          if (wi !== cur.q.answer) { choose(wi); return 'wrong'; }
        }
      }
      if (RULES.debugWrong && waited < 6) return 'hold';
      if (waited < 1.4) return 'read';
      choose(cur.q.answer);
      return 'answer';
    }
    return 'noop';
  };

  /* 侧栏缩略图：把代码画的小狐狸和星星渲染成 PNG */
  function slotCanvas(size, draw) {
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var g = c.getContext('2d');
    draw(g, size);
    return c.toDataURL('image/png');
  }
  window.__renderSlots = function (size) {
    size = size || 256;
    return {
      hero: slotCanvas(size, function (g, s) {
        drawFox(g, s / 2, s * 0.9, s * 0.78, 'happy');
      }),
      pickup: slotCanvas(size, function (g, s) {
        drawStar(g, s / 2, s / 2, s * 0.3, C.gold, C.goldDeep);
      })
    };
  };

  /* ============================================================
   * 14. 启动
   * ============================================================ */
  window.addEventListener('error', function (e) {
    emit('error', { message: String((e && e.message) || 'error').slice(0, 300) });
  });

  var img = new Image();
  img.onload = function () { bgImg = img; };
  if (GAME.assets && GAME.assets.background) img.src = GAME.assets.background;

  resize();
  if (RULES.debugView === 'parent') { state.phase = 'parent'; layout(); }
  if (RULES.debugSeedWeek) {
    var seedChars = ['鱼', '鸟', '山', '水', '火', '木', '花', '草', '猫', '狗', '兔', '云', '雨', '星', '月', '日', '人', '口', '手', '大', '小', '上', '中'];
    var seedWords = ['cat', 'dog', 'pig', 'sun', 'moon', 'star', 'book', 'bus'];
    for (var si = 0; si < 7; si++) {
      var skey = daysBack(1, 6 - si)[0];
      var se = dayEntry(skey);
      se.a = 5 + (si * 4) % 11;
      se.c = se.a - (si % 3);
      se.s = { lit: 2 + si % 3, math: 2, en: 1 + si % 2, pinyin: si % 2 };
      for (var sj = 0; sj < 3; sj++) {
        var sch = seedChars[(si * 3 + sj) % seedChars.length];
        if (se.l.indexOf(sch) < 0) se.l.push(sch);
        save.learnedChars[sch] = 1;
      }
      if (si % 2 === 0) {
        var sw = seedWords[si % seedWords.length];
        if (se.w.indexOf(sw) < 0) se.w.push(sw);
        save.learnedWords[sw] = 1;
      }
    }
    [makeLit(), makeMath(), makeEn()].forEach(function (q) {
      if (q) save.wrong.push({ id: 'seed-' + q.id, q: q, n: 1, t: Date.now() });
    });
  }
  if (RULES.debugView === 'report') { state.phase = 'report'; layout(); }
  if (RULES.debugSeedWrong) {
    [makeLit(), makeMath(), makeEn()].forEach(function (q) {
      if (q) save.wrong.push({ id: q.id, q: q, n: 1, t: Date.now() });
    });
  }
  requestAnimationFrame(frame);
  setTimeout(function () { emit('renders', { renders: window.__renderSlots(256) }); }, 60);

  // 首页轻微延迟后打个招呼（不自动播，等用户点）
  setTimeout(function () {
    if (state.phase === 'title' && speechOn) say('我们来玩星星课堂吧', 'zh-CN', true);
  }, 900);
})();
</script>
</body></html>
